# Runs the project's automatic checks (lint, content, effects registry, page render smoke test, production build) on every push
# and pull request. The same thing runs locally with `npm run check`.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
